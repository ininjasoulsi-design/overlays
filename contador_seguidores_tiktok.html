<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contador de seguidores – estilo GTA VI</title>
<!--
  CONTADOR DE SEGUIDORES DE TIKTOK (para OBS → Fuente de navegador)

  Se configura con la dirección (URL) del archivo. Parámetros:
    inicio   = seguidores con los que empiezas el stream     (ej. inicio=3477)
    meta     = meta de seguidores (opcional, muestra barra)  (ej. meta=5000)
    usuario  = tu usuario de TikTok sin @                    (por defecto _rodri_gz_)
    apikey   = tu clave gratuita de https://tik.tools         (necesaria para contar en vivo)
    prueba=1 = simula seguidores cada pocos segundos para ver cómo se ve

  Ejemplo:
    file:///C:/Overlays/contador_seguidores_tiktok.html?inicio=3477&meta=5000&apikey=TU_CLAVE

  Ajuste manual (OBS → clic derecho en la fuente → Interactuar):
    tecla  +  suma 1     tecla  -  resta 1     tecla  0  vuelve al número de "inicio"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --peach:#ffc46b; --orange:#ff8a3d; --pink:#ff2e93; --purple:#7b2ff7; --indigo:#26104a; --cyan:#19e3e3; --yellow:#ffd61f;
  }
  html,body{margin:0;background:transparent;overflow:hidden;font-family:'Fira Sans','Segoe UI',Arial,sans-serif}
  .wrap{position:relative;display:inline-block;padding:36px 46px}
  .card{
    position:relative;min-width:420px;padding:18px 34px 20px 30px;border-radius:24px;
    background:linear-gradient(160deg,#3a1060 0%,#1a0834 100%);
    display:flex;align-items:center;gap:24px;
  }
  /* borde degradado atardecer + brillo neón */
  .card::before{
    content:"";position:absolute;inset:-6px;border-radius:30px;z-index:-1;
    background:linear-gradient(135deg,var(--peach),var(--orange) 30%,var(--pink) 62%,var(--purple));
    box-shadow:0 0 22px rgba(255,46,147,.75),0 0 46px rgba(255,138,61,.45);
    animation:glow 3s ease-in-out infinite;
  }
  .card::after{ /* línea cian interior */
    content:"";position:absolute;inset:3px;border-radius:21px;border:2px solid rgba(25,227,227,.85);
    box-shadow:inset 0 0 10px rgba(25,227,227,.35);pointer-events:none;
  }
  @keyframes glow{50%{box-shadow:0 0 30px rgba(255,46,147,.95),0 0 64px rgba(255,138,61,.6)}}
  /* esquinas tipo corchete */
  .corner{position:absolute;width:30px;height:30px;border:4px solid var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
  .c1{left:22px;top:22px;border-right:none;border-bottom:none}
  .c2{right:22px;top:22px;border-left:none;border-bottom:none}
  .c3{left:22px;bottom:22px;border-right:none;border-top:none}
  .c4{right:22px;bottom:22px;border-left:none;border-top:none}

  .icon{width:86px;height:86px;border-radius:20px;flex:none;position:relative;
    background:linear-gradient(140deg,var(--pink),var(--purple));display:grid;place-items:center;
    box-shadow:0 0 16px rgba(255,46,147,.7)}
  .icon{border-radius:50%;padding:4px;background:linear-gradient(140deg,var(--orange),var(--pink),var(--purple))}
  .fbadge{position:absolute;left:50%;bottom:-12px;width:30px;height:30px;margin-left:-15px;border-radius:50%;
    background:#fe2c55;border:3px solid #fff;box-sizing:border-box;display:grid;place-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s ease}
  .fbadge svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .fbadge .fck{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s ease .1s}
  .fbadge .fpl{transition:opacity .15s ease, transform .25s ease;transform-origin:12px 12px}
  .fbadge.press{transform:scale(.75)}
  .fbadge.done{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .fbadge.done .fpl{opacity:0;transform:rotate(90deg) scale(.4)}
  .fbadge.done .fck{stroke-dashoffset:0}
  @keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .fring{position:absolute;left:50%;bottom:3px;width:30px;height:30px;margin:0 0 -15px -15px;border-radius:50%;
    border:3px solid #fe2c55;opacity:0;pointer-events:none}
  .fring.go{animation:ring .6s ease-out}
  @keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
  .pfp{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #1a0834;box-sizing:border-box}
  .icon.beat{animation:beat .6s ease}
  @keyframes beat{30%{transform:scale(1.18)}60%{transform:scale(.95)}}

  .label{font-weight:900;letter-spacing:3px;font-size:19px;color:var(--cyan);text-shadow:0 0 8px rgba(25,227,227,.6);margin-bottom:2px}
  .num{display:flex;font-family:'Anton','Impact',sans-serif;font-size:70px;line-height:1;height:78px;color:#fff;
    text-shadow:0 0 14px rgba(255,46,147,.8),0 3px 0 #a3125a}
  .digit{position:relative;height:78px;overflow:hidden;width:.56em;text-align:center}
  .digit .strip{position:absolute;left:0;right:0;top:0;transition:transform .9s cubic-bezier(.2,1.4,.4,1)}
  .digit .strip span{display:block;height:78px;line-height:78px}
  .sep{width:.28em;text-align:center;line-height:78px}

  .bar{margin-top:10px;height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;display:none}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;
    background:linear-gradient(90deg,var(--orange),var(--pink),var(--purple));box-shadow:0 0 10px var(--pink);transition:width 1s ease}
  .goal{display:none;font-weight:800;font-size:15px;color:var(--peach);margin-top:4px;letter-spacing:1px}

  /* +1 flotante */
  .plus{position:absolute;right:86px;top:40px;font-family:'Anton','Impact',sans-serif;font-size:44px;color:var(--yellow);
    text-shadow:0 0 12px rgba(255,214,31,.9),0 2px 0 #b5521a;opacity:0;pointer-events:none}
  .plus.go{animation:plus 1.6s ease-out forwards}
  @keyframes plus{0%{opacity:0;transform:translateY(20px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-55px) scale(1)}}

  /* "¡Gracias @usuario!" */
  .thanks{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,0);white-space:nowrap;
    padding:6px 18px;border-radius:14px;font-weight:900;font-size:18px;color:#fff;
    background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 0 14px rgba(255,46,147,.8);
    opacity:0;pointer-events:none}
  .thanks.go{animation:thanks 3s ease forwards}
  @keyframes thanks{0%{opacity:0;transform:translate(-50%,20px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

  .spark{position:absolute;width:8px;height:8px;pointer-events:none;background:var(--yellow);
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}

  .status{position:absolute;left:52px;top:10px;font:700 12px Arial;color:#fff;opacity:.85;
    padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.45);transition:opacity 1s}
  .status.ok{opacity:0}
</style>
</head>

      <div class="num" id="num"></div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="goal" id="goal"></div>
    </div>
  </div>
  <div class="plus" id="plus">+1</div>
  <div class="thanks" id="thanks"></div>
  <div class="status" id="status">conectando…</div>
</div>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const INICIO  = parseInt(P.get('inicio') || '0', 10) || 0;
  const META    = parseInt(P.get('meta') || '0', 10) || 0;
  const USUARIO = (P.get('usuario') || '_rodri_gz_').replace(/^@/, '');
  const APIKEY  = P.get('apikey') || '';
  const PRUEBA  = P.get('prueba') === '1';

  // ---- memoria: si OBS recarga la fuente, no se pierden los follows de este stream.
  //      Al cambiar "inicio" en la URL, el contador vuelve a empezar desde ese número.
  const KEY = 'contadorTikTok_' + USUARIO;
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { st = null; }
  if (!st || st.inicio !== INICIO) st = { inicio: INICIO, extra: 0, vistos: [] };
  const vistos = new Set(st.vistos);
  const save = () => { try { st.vistos = [...vistos].slice(-3000); localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  save();

  // ---- dibujo del número con dígitos que giran
  const numEl = document.getElementById('num');
  function render(n) {
    const txt = n.toLocaleString('es-MX');
    if (numEl.dataset.len !== String(txt.length)) {
      numEl.innerHTML = '';
      for (const ch of txt) {
        if (/\d/.test(ch)) {
          const d = document.createElement('div'); d.className = 'digit';
          const s = document.createElement('div'); s.className = 'strip';
          for (let i = 0; i <= 9; i++) { const sp = document.createElement('span'); sp.textContent = i; s.appendChild(sp); }
          d.appendChild(s); numEl.appendChild(d);
        } else { const sp = document.createElement('div'); sp.className = 'sep'; sp.textContent = ch; numEl.appendChild(sp); }
      }
      numEl.dataset.len = txt.length;
    }
    let k = 0;
    for (const ch of txt) {
      const el = numEl.children[k++];
      if (/\d/.test(ch)) el.firstChild.style.transform = `translateY(${-78 * +ch}px)`;
    }
    if (META > 0) {
      document.getElementById('bar').style.display = 'block';
      const g = document.getElementById('goal'); g.style.display = 'block';
      document.getElementById('fill').style.width = Math.min(100, n / META * 100) + '%';
      g.textContent = `META ${META.toLocaleString('es-MX')} · faltan ${Math.max(0, META - n).toLocaleString('es-MX')}`;
    }
  }
  const total = () => st.inicio + st.extra;
  render(total());

  // ---- efectos al recibir un follow
  const wrap = document.getElementById('wrap');
  function sparks() {
    const r = wrap.getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div'); s.className = 'spark';
      const x = r.width * (0.25 + Math.random() * 0.6), y = r.height * (0.2 + Math.random() * 0.5);
      s.style.left = x + 'px'; s.style.top = y + 'px';
      wrap.appendChild(s);
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      s.animate([{ transform: 'scale(0)', opacity: 1 },
                 { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(${1 + Math.random() * 1.6}) rotate(90deg)`, opacity: 0 }],
                { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
    }
  }
  const fb = document.getElementById('fbadge'), fr = document.getElementById('fring');
  let fbBusy = false;
  function followAnim() {
    if (fbBusy) return; fbBusy = true;
    fb.classList.add('press');
    setTimeout(() => { fb.classList.remove('press'); fb.classList.add('done');
      fr.classList.remove('go'); void fr.offsetWidth; fr.classList.add('go'); }, 180);
    setTimeout(() => { fb.classList.remove('done'); fbBusy = false; }, 2200);
  }
  setInterval(followAnim, 6000); setTimeout(followAnim, 1200);
  const queue = [];
  let busy = false;
  function celebrate(name) {
    const plus = document.getElementById('plus'), icon = document.getElementById('icon'), th = document.getElementById('thanks');
    plus.classList.remove('go'); icon.classList.remove('beat'); void plus.offsetWidth; plus.classList.add('go'); icon.classList.add('beat');
    sparks(); followAnim();
    if (name) { th.textContent = `¡Gracias ${name}! ❤`; th.classList.remove('go'); void th.offsetWidth; th.classList.add('go'); }
  }
  function next() {
    if (!queue.length) { busy = false; return; }
    busy = true;
    const name = queue.shift();
    st.extra++; save(); render(total()); celebrate(name);
    setTimeout(next, queue.length > 5 ? 500 : 1400);   // si llegan muchos juntos, se aceleran
  }
  function addFollow(id, name) {
    if (id) { if (vistos.has(id)) return; vistos.add(id); }
    queue.push(name); if (!busy) next();
  }
  function adjust(delta) { st.extra += delta; save(); render(total()); }

  // ---- teclas para ajustar a mano (OBS → Interactuar)
  addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') adjust(1);
    else if (e.key === '-') adjust(-1);
    else if (e.key === '0') { st.extra = 0; vistos.clear(); save(); render(total()); }
  });

  // ---- conexión con TikTok LIVE (vía tik.tools)
  const status = document.getElementById('status');
  const setStatus = (t, ok) => { status.textContent = t; status.classList.toggle('ok', !!ok); };
  // ---- modo diagnóstico (&debug=1): muestra los eventos que llegan
  const DEBUG = P.get('debug') === '1';
  let dbg = null, dbgLines = [];
  if (DEBUG) { dbg = document.createElement('div');
    dbg.style.cssText = 'position:fixed;left:6px;bottom:6px;right:6px;font:12px monospace;color:#fff;background:rgba(0,0,0,.75);padding:6px;border-radius:6px;white-space:pre;z-index:9';
    document.body.appendChild(dbg); }
  function logDbg(t) { if (!DEBUG) return; dbgLines.unshift(t); dbgLines = dbgLines.slice(0, 8); dbg.textContent = dbgLines.join('\n'); }
  function handle(m) {
    const type = String(m.event || m.type || m.eventType || '').toLowerCase();
    const d = m.data || m.payload || m;
    const u = d.user || (d.data && d.data.user) || d;
    const label = String(d.displayType || d.label || d.action || d.message || '');
    logDbg(`${new Date().toLocaleTimeString()}  ${type || '?'}  ${u.uniqueId || ''} ${label.slice(0, 40)}`);
    const isFollow = type.includes('follow') ||
      ((type === 'social' || type === 'socialmessage') && /follow/i.test(label)) ||
      String(d.action) === '1' && type === 'social';
    if (isFollow) addFollow(String(u.uniqueId || u.userId || ''), u.nickname || u.uniqueId || '');
  }
  let retry = 15000;   // espera entre reintentos: crece hasta 5 min si no estás en vivo (ahorra peticiones)
  function connect() {
    if (!APIKEY) { setStatus(PRUEBA ? 'modo prueba' : 'falta apikey en la URL', PRUEBA); return; }
    let ws;
    try { ws = new WebSocket(`wss://api.tik.tools?uniqueId=${encodeURIComponent(USUARIO)}&apiKey=${encodeURIComponent(APIKEY)}`); }
    catch (e) { setStatus('error de conexión'); setTimeout(connect, 15000); return; }
    ws.onopen = () => setStatus('conectado a @' + USUARIO, true);
    ws.onmessage = ev => { retry = 15000;
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      const list = Array.isArray(m) ? m : (Array.isArray(m.events) ? m.events : [m]);
      for (const it of list) handle(it);
    };
    ws.onclose = e => { logDbg(`conexión cerrada (${e && e.code || ''}) ${e && e.reason || ''}`); setStatus('esperando LIVE de @' + USUARIO + '…'); setTimeout(connect, retry); retry = Math.min(retry * 2, 300000); };
    ws.onerror = () => {};
  }
  connect();

  if (PRUEBA) {
    const nombres = ['vicecity_fan', 'lucia.gz', 'neon_rider', 'Tommy V.', 'palmeras_88', 'jason_mx'];
    let i = 0;
    setInterval(() => addFollow('prueba' + Date.now(), nombres[i++ % nombres.length]), 3500);
  }
})();
</script>
</body>
</html>
